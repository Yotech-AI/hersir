[package]
name = "gizai-core"
description = "Hersir core: SQLite store, domain and workflow (no Tauri)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
getrandom = { workspace = true }
zstd = { workspace = true }
# Readable copies of Word, Excel, PowerPoint, OpenDocument and RTF files (src/readable, GA-310): a document's parts read
# from its zip into memory, their XML parsed by quick-xml (which fetches nothing: no external entities), spreadsheets
# read by calamine, and an RTF file's code page decoded by encoding_rs (codepage maps its number to one).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
calamine = "0.38"
encoding_rs = "0.8"
codepage = "0.1"

# Local time on Windows (db.rs: local_offset_secs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
tempfile = { workspace = true }
