[package]
name = "gizai-agents"
description = "Hersir agents: Claude Code argv, stream-json parsing, outcomes, worktrees and processes (no Tauri)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# The keychain: Secret Service on Linux, the login keychain on macOS, Credential Manager on Windows.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
# Terminals (src/terminal.rs): pseudo-terminals on Linux and macOS, ConPTY on Windows. Pinned: its last release is from
# February 2025, and a later fix would come as a git dependency or a copy (docs/research/terminal.md §3.2 Q1).
portable-pty = "=0.9.0"
# A release's signature (src/release_sig.rs, GA-253): an SSH signature (SSHSIG, what ssh-keygen -Y sign makes) by an
# ed25519 key, checked in Hersir itself, never by a program from PATH. Only ed25519: the release keys are ed25519 keys.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
# A release's ready-made build (src/update.rs, GA-253), unpacked in Hersir itself: a .tar.gz on Linux and macOS, a .zip
# (deflate) on Windows. Each on every system, so tests can unpack both.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Job Objects (an agent's whole process tree) and finding programs on Windows (see src/os.rs), and the computer's memory
# (src/run_memory.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
