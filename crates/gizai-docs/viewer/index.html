<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>dev docs</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <!-- A file, because serve's Content-Security-Policy refuses inline scripts. Not a module, so it runs before first paint. -->
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div id="shell">
      <header>
        <button id="menu" class="icon-btn only-narrow" title="Sections" aria-label="Sections">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.33" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span id="brand"></span>
        <span class="bar-divider" aria-hidden="true"></span>
        <nav id="tabs"></nav>
        <button id="search-open" class="search-trigger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3"/></svg>
          <span class="only-wide">Search</span>
          <kbd class="only-wide">⌘K</kbd>
        </button>
        <button id="theme" class="icon-btn" title="Switch theme" aria-label="Switch theme"></button>
        <span id="commit" class="commit mono" hidden></span>
      </header>

      <main>
        <aside id="side"></aside>
        <section id="body"></section>
      </main>
    </div>

    <div id="search-dialog" hidden>
      <div class="s-panel" role="dialog" aria-label="Search">
        <div class="s-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="Search classes, routes, guides, decisions…"
                 autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
        </div>
        <div id="search-tabs" class="s-tabs"></div>
        <div id="search-list" class="s-list"></div>
        <div class="s-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>Tab</kbd> section</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
