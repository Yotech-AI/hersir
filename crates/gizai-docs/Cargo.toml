[package]
name = "gizai-docs"
description = "Hersir docs: a project's docs index, read from its files with tree-sitter (no Tauri)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# A hash of each file's text, so the next view of the Reference parses only the files that changed (`Kept`, GA-362).
sha2 = { workspace = true }
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-dart = "0.3"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-typescript = "0.23"

# O_NOFOLLOW and O_NONBLOCK, to open a project's file without following a link or waiting on a FIFO (`open_plain`).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
