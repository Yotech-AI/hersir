[package]
name = "gizai-docs"
description = "Hersir docs: a project's docs page (yodocs' viewer) and its index, read from its files with tree-sitter (no Tauri)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-dart = "0.3"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = { workspace = true }
