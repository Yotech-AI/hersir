# Builds and tests Gizai on Linux, macOS (Apple silicon) and Windows, on every pull request and every push to main.
# A pull request into main that only bumps Gizai's version passes without building or testing (the "Version only?"
# step). When one changes the AUR package (packaging/), install.sh or this workflow, Arch Linux builds, checks and
# installs the AUR package too (the arch job). When one changes the Scoop package (packaging/scoop), install.ps1,
# gizai-mcp's Cargo.toml or this workflow, Windows builds Hersir as Release builds does and installs it with Scoop from
# a local bucket (the scoop job). It signs, releases, publishes and uploads nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Windows' git turns LF into CRLF on checkout; the tests read scripts and text files as they are in the repository.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # A release's first step, the version bump's pull request into main, skips the rest when it changes nothing but
      # Gizai's version: the release's pull request into production runs it all (docs/RELEASING.md, Making a release).
      # The steps are skipped one by one, as a job skipped with if: never reports its matrix's three checks, and
      # branch protection would wait for them. HEAD is the pull request's merge commit, and HEAD^1 is main. When the
      # fetch or the check fails, everything runs.
      - name: Version only?
        id: version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA" || exit 0
          if node scripts/version-only.mjs HEAD^1 HEAD; then echo "only=true" >> "$GITHUB_OUTPUT"; fi

      # Many tests make git commits, and a runner has no git identity of its own.
      - name: Git identity for the tests
        if: steps.version.outputs.only != 'true'
        run: |
          git config --global user.name "Gizai CI"
          git config --global user.email "ci@gizai.invalid"
          git config --global init.defaultBranch main

      # What Tauri 2 needs on Linux (the packages install.sh names for Debian and Ubuntu), and D-Bus for the keychain.
      - name: Linux packages
        if: steps.version.outputs.only != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev build-essential pkg-config patchelf curl wget file

      - uses: actions/setup-node@v4
        if: steps.version.outputs.only != 'true'
        with:
          node-version: 22 # the README asks for Node.js 20 or newer; Vite 8 needs 20.19 or 22.12 and up
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.only != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.only != 'true'

      # The install scripts parse, and their checks pass (--check and -Check install nothing). On macOS install.sh must
      # work with the system's own bash, 3.2; install.ps1 with Windows PowerShell 5.1 (what an update runs) and 7. On
      # Linux the packages above bring libayatana-appindicator, so the check must not call the tray icon's library
      # missing: it did when grep -q cut ldconfig's long list short (GA-248).
      - name: Check install.sh
        if: steps.version.outputs.only != 'true' && runner.os != 'Windows'
        run: |
          /bin/bash -n install.sh
          check="$(/bin/bash ./install.sh --check)"
          printf '%s\n' "$check"
          case "$check" in
            *"Tray icon:"*) echo "install.sh --check says the tray icon's library is missing, though it is installed."; exit 1 ;;
          esac

      - name: Check install.ps1 (PowerShell 7)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          pwsh -NoProfile -File .\install.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check install.ps1 (Windows PowerShell 5.1)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The one-line installs: get.sh passes sh -n, and get.ps1 parses in both PowerShells. Then each one's check runs
      # the way the one line runs it, get.sh from a pipe (dash on Linux, macOS's own sh) and get.ps1 from memory (as
      # irm | iex does), into a scratch folder: first production from GitHub, with the GIZAI_ names from before 0.17.0
      # (GIZAI_REPO and GIZAI_REF), then this pull request's own commit over it with the HERSIR_ names, which win over
      # the GIZAI_ ones still set. The source folder, hersir-src, must hold that commit at the end. The one from before
      # 0.17.0, gizai-src, becomes hersir-src first, with its build in target/ (GA-248).
      - name: Check get.sh
        if: steps.version.outputs.only != 'true' && runner.os != 'Windows'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/get-sh
        run: |
          /bin/sh -n scripts/get.sh
          mkdir -p "$XDG_DATA_HOME/gizai-src/target" && echo "a build" > "$XDG_DATA_HOME/gizai-src/target/kept"
          cat scripts/get.sh | GIZAI_REPO=https://github.com/Yotech-AI/hersir.git GIZAI_REF=production /bin/sh -s -- --check
          test ! -e "$XDG_DATA_HOME/gizai-src" && test -f "$XDG_DATA_HOME/hersir-src/target/kept"
          cat scripts/get.sh | GIZAI_REPO=https://github.com/Yotech-AI/hersir.git GIZAI_REF=production \
            HERSIR_REPO="$GITHUB_WORKSPACE" HERSIR_REF=HEAD /bin/sh -s -- --check
          test "$(git -C "$XDG_DATA_HOME/hersir-src" rev-parse HEAD)" = "$GITHUB_SHA"

      # get.ps1 runs from memory in a PowerShell of its own, which must go on after it: piped into iex, get.ps1 returns
      # rather than exit (which would close the window), with its result in $LASTEXITCODE. Run as a file, it exits
      # with that result: 0, and 1 for a ref that doesn't exist.
      - name: Check get.ps1 (PowerShell 7)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\get.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\get-ps1-7"
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\gizai-src\target" | Out-Null
          Set-Content -LiteralPath "$env:LOCALAPPDATA\gizai-src\target\kept" -Value 'a build'
          $iex = "$env:RUNNER_TEMP\iex-get-ps1-7.ps1"
          Set-Content -LiteralPath $iex -Value '& ([scriptblock]::Create((Get-Content -LiteralPath scripts\get.ps1 -Raw))) -Check; "returned $LASTEXITCODE"'
          foreach ($from in @('GIZAI', 'https://github.com/Yotech-AI/hersir.git', 'production'), @('HERSIR', $env:GITHUB_WORKSPACE, 'HEAD')) {
            Set-Item -Path "env:$($from[0])_REPO" -Value $from[1]; Set-Item -Path "env:$($from[0])_REF" -Value $from[2]
            pwsh -NoProfile -File $iex | Tee-Object -Variable out
            if (@($out)[-1] -ne 'returned 0') { "get.ps1 -Check didn't return 0 for $from"; exit 1 }
            if ((Test-Path -LiteralPath "$env:LOCALAPPDATA\gizai-src") -or -not (Test-Path -LiteralPath "$env:LOCALAPPDATA\hersir-src\target\kept")) {
              'gizai-src should have become hersir-src, with its target folder'; exit 1
            }
          }
          pwsh -NoProfile -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 0) { "get.ps1 -Check as a file exited with $LASTEXITCODE, not 0"; exit 1 }
          $env:HERSIR_REF = 'no-such-ref'
          pwsh -NoProfile -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 1) { "get.ps1 -Check as a file exited with $LASTEXITCODE for a ref that doesn't exist, not 1"; exit 1 }
          $head = git -C "$env:LOCALAPPDATA\hersir-src" rev-parse HEAD
          if ($head -ne $env:GITHUB_SHA) { "hersir-src is at $head, not at $env:GITHUB_SHA"; exit 1 }

      - name: Check get.ps1 (Windows PowerShell 5.1)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\get.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\get-ps1-5"
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\gizai-src\target" | Out-Null
          Set-Content -LiteralPath "$env:LOCALAPPDATA\gizai-src\target\kept" -Value 'a build'
          $iex = "$env:RUNNER_TEMP\iex-get-ps1-5.ps1"
          Set-Content -LiteralPath $iex -Value '& ([scriptblock]::Create((Get-Content -LiteralPath scripts\get.ps1 -Raw))) -Check; "returned $LASTEXITCODE"'
          foreach ($from in @('GIZAI', 'https://github.com/Yotech-AI/hersir.git', 'production'), @('HERSIR', $env:GITHUB_WORKSPACE, 'HEAD')) {
            Set-Item -Path "env:$($from[0])_REPO" -Value $from[1]; Set-Item -Path "env:$($from[0])_REF" -Value $from[2]
            powershell -NoProfile -ExecutionPolicy Bypass -File $iex | Tee-Object -Variable out
            if (@($out)[-1] -ne 'returned 0') { "get.ps1 -Check didn't return 0 for $from"; exit 1 }
            if ((Test-Path -LiteralPath "$env:LOCALAPPDATA\gizai-src") -or -not (Test-Path -LiteralPath "$env:LOCALAPPDATA\hersir-src\target\kept")) {
              'gizai-src should have become hersir-src, with its target folder'; exit 1
            }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 0) { "get.ps1 -Check as a file exited with $LASTEXITCODE, not 0"; exit 1 }
          $env:HERSIR_REF = 'no-such-ref'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 1) { "get.ps1 -Check as a file exited with $LASTEXITCODE for a ref that doesn't exist, not 1"; exit 1 }
          $head = git -C "$env:LOCALAPPDATA\hersir-src" rev-parse HEAD
          if ($head -ne $env:GITHUB_SHA) { "hersir-src is at $head, not at $env:GITHUB_SHA"; exit 1 }

      - run: npm ci
        if: steps.version.outputs.only != 'true'

      - run: npm run build
        if: steps.version.outputs.only != 'true'

      # First, as it takes seconds: it still runs when the Rust tests fail later.
      - run: npm test
        if: steps.version.outputs.only != 'true'

      # Gizai and its helpers on their own first, so a test that doesn't build still shows whether the app itself does.
      - run: cargo build --workspace
        if: steps.version.outputs.only != 'true'

      # Every test binary, also after one fails, so one run shows all the failures on a system.
      - run: cargo test --workspace --no-fail-fast
        if: steps.version.outputs.only != 'true'

  # Whether this pull request (or push to main) changes what the arch job checks: the AUR package and its licence
  # (packaging/), install.sh, whose launcher and desktop entry the package makes, and this workflow. The rest of Hersir
  # never goes into the package, which installs a release's ready-made build; so a version bump changes none of it.
  # HEAD is the pull request's merge commit, and HEAD^1 is main; for a push, the commit main was at before. When the
  # fetch or the check fails, the arch job runs.
  aur-changes:
    name: AUR package changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: AUR package changed?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA" && base="HEAD^1" || base=""
          else
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE" || base=""
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- packaging install.sh .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # hersir-bin, the AUR package (packaging/aur/hersir-bin), built on Arch Linux as its users build it: makepkg as a user
  # of its own, with the package's dependencies, from the release its PKGBUILD names. makepkg checks the release's
  # archive against its line in that release's signed SHA256SUMS, and install.sh, the icons and NOTICE against their
  # sha256s in git at the release's commit. namcap must report no error on the PKGBUILD or the package. Then pacman
  # installs it, and:
  # - hersir --version says the PKGBUILD's version, and /usr/lib/hersir/hersir-package.txt says aur (GA-199);
  # - the package holds exactly its files, its programs as the release built them;
  # - the launcher, the desktop entry and the icons are the ones install.sh --skip-build makes at the release's commit,
  #   and the PKGBUILD makes this commit's install.sh's launcher and desktop entry too, for the next release;
  # - pacman -Rns removes it and leaves a data folder as it was.
  # It publishes nothing: the AUR gets a package only from scripts/packages.sh, on Jeffrey's computer.
  arch:
    name: Arch Linux (hersir-bin)
    needs: aur-changes
    if: needs.aur-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BUILD: /home/builder/hersir-bin
    steps:
      # Arch rolls, so a full upgrade first: installing from fresh lists onto an older system is a partial upgrade. git
      # before the checkout, which makes no git repository without it; base-devel for makepkg, and namcap.
      - name: Package lists, git, base-devel and namcap
        run: |
          set -eux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git namcap
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      # makepkg never runs as root. Like yay, it installs the package's dependencies with sudo pacman.
      - name: A user that builds the package
        run: |
          set -eux
          useradd --create-home builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          cp -r packaging/aur/hersir-bin "$BUILD"
          chown -R builder:builder "$BUILD"

      - name: .SRCINFO is what makepkg --printsrcinfo makes of the PKGBUILD
        working-directory: ${{ env.BUILD }}
        run: sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: makepkg
        working-directory: ${{ env.BUILD }}
        run: sudo -u builder makepkg --syncdeps --noconfirm

      - name: namcap reports no error on the PKGBUILD or the package
        working-directory: ${{ env.BUILD }}
        run: |
          set -o pipefail
          namcap PKGBUILD | tee namcap.txt
          namcap hersir-bin-*.pkg.tar.zst | tee -a namcap.txt
          if grep ' E: ' namcap.txt; then echo "namcap reports an error (above)."; exit 1; fi

      - name: Install it with pacman
        run: pacman -U --noconfirm "$BUILD"/hersir-bin-*.pkg.tar.zst

      - name: Hersir says its version, hersir-package.txt says aur, and the package holds exactly its files
        working-directory: ${{ env.BUILD }}
        run: |
          set -euxo pipefail
          . ./PKGBUILD
          # As you run it: the hersir command, through the launcher, as a user.
          test "$(sudo -u builder hersir --version)" = "hersir $pkgver"
          test "$(cat /usr/lib/hersir/hersir-package.txt)" = aur
          test "$(readlink /usr/bin/hersir)" = /usr/lib/hersir/hersir-launch
          cmp /usr/lib/hersir/hersir src/target/release/hersir
          cmp /usr/lib/hersir/hersir-mcp src/target/release/hersir-mcp
          pacman -Qlq hersir-bin | grep -v '/$' | sort > files.txt
          printf '%s\n' /usr/bin/hersir /usr/lib/hersir/hersir /usr/lib/hersir/hersir-launch /usr/lib/hersir/hersir-mcp \
            /usr/lib/hersir/hersir-package.txt /usr/share/applications/hersir.desktop \
            /usr/share/icons/hicolor/32x32/apps/hersir.png /usr/share/icons/hicolor/64x64/apps/hersir.png \
            /usr/share/icons/hicolor/128x128/apps/hersir.png /usr/share/icons/hicolor/256x256/apps/hersir.png \
            /usr/share/icons/hicolor/512x512/apps/hersir.png /usr/share/icons/hicolor/scalable/apps/hersir.svg \
            /usr/share/licenses/hersir-bin/NOTICE | sort | diff -u - files.txt

      # install.sh itself, at the release's commit, with the release's programs where --skip-build takes them, into a
      # scratch folder: its launcher, desktop entry and icons, with that folder as /usr/lib/hersir, are the package's.
      - name: The launcher, the desktop entry and the icons are the ones install.sh makes at the release's commit
        run: |
          set -euxo pipefail
          . "$BUILD/PKGBUILD"
          src="$RUNNER_TEMP/release-source" scratch="$RUNNER_TEMP/install-sh"
          git init -q "$src"
          git -C "$src" fetch -q --depth=1 --no-tags "https://github.com/Yotech-AI/hersir.git" "$_commit"
          git -C "$src" checkout -q FETCH_HEAD
          mkdir -p "$src/target/release"
          cp "$BUILD/src/target/release/hersir" "$BUILD/src/target/release/hersir-mcp" "$src/target/release/"
          HOME="$scratch/home" XDG_DATA_HOME="$scratch/share" HERSIR_PREFIX="$scratch/prefix" bash "$src/install.sh" --skip-build
          lib="$scratch/prefix/lib/hersir"
          diff -u <(sed "s#$lib#/usr/lib/hersir#g" "$lib/hersir-launch") /usr/lib/hersir/hersir-launch
          diff -u <(sed "s#$lib#/usr/lib/hersir#g" "$scratch/share/applications/hersir.desktop") /usr/share/applications/hersir.desktop
          test "$(readlink "$scratch/prefix/bin/hersir")" = "$lib/hersir-launch"
          icons="$scratch/share/icons/hicolor"
          cmp "$icons/32x32/apps/hersir.png" /usr/share/icons/hicolor/32x32/apps/hersir.png
          cmp "$icons/64x64/apps/hersir.png" /usr/share/icons/hicolor/64x64/apps/hersir.png
          cmp "$icons/128x128/apps/hersir.png" /usr/share/icons/hicolor/128x128/apps/hersir.png
          cmp "$icons/256x256/apps/hersir.png" /usr/share/icons/hicolor/256x256/apps/hersir.png
          cmp "$icons/512x512/apps/hersir.png" /usr/share/icons/hicolor/512x512/apps/hersir.png
          cmp "$icons/scalable/apps/hersir.svg" /usr/share/icons/hicolor/scalable/apps/hersir.svg

      # The next release's package makes its launcher and desktop entry from this commit's install.sh: the PKGBUILD's
      # way must still give what install.sh itself writes.
      - name: The PKGBUILD makes this commit's install.sh's launcher and desktop entry too
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/this-commit" scratch="$RUNNER_TEMP/install-sh-this-commit"
          mkdir -p "$work" target/release
          (
            . "$BUILD/PKGBUILD"
            srcdir="$work"
            cp install.sh "$srcdir/hersir-$pkgver-install.sh"
            _install_sh LAUNCH > "$work/hersir-launch"
            _install_sh DESKTOP > "$work/hersir.desktop"
          )
          cp "$BUILD/src/target/release/hersir" "$BUILD/src/target/release/hersir-mcp" target/release/
          HOME="$scratch/home" XDG_DATA_HOME="$scratch/share" HERSIR_PREFIX="$scratch/prefix" bash ./install.sh --skip-build
          lib="$scratch/prefix/lib/hersir"
          diff -u <(sed "s#$lib#/usr/lib/hersir#g" "$lib/hersir-launch") "$work/hersir-launch"
          diff -u <(sed "s#$lib#/usr/lib/hersir#g" "$scratch/share/applications/hersir.desktop") "$work/hersir.desktop"

      - name: Removing the package leaves the data folder as it was
        run: |
          set -euxo pipefail
          home=/home/builder
          sudo -u builder mkdir -p "$home/.local/share/hersir/backups" "$home/.local/share/dev.hersir.app"
          sudo -u builder sh -c 'printf "your data\n" > "$1/hersir/gizai.db"; printf "a backup\n" > "$1/hersir/backups/gizai-manual.db"; printf "storage\n" > "$1/dev.hersir.app/storage"' sh "$home/.local/share"
          before="$(cd "$home/.local/share" && find hersir dev.hersir.app -exec ls -ld --time-style=+%s {} + | sort && find hersir dev.hersir.app -type f -exec sha256sum {} + | sort)"
          pacman -Rns --noconfirm hersir-bin
          test ! -e /usr/lib/hersir && test ! -e /usr/bin/hersir && test ! -e /usr/share/applications/hersir.desktop
          test "$(cd "$home/.local/share" && find hersir dev.hersir.app -exec ls -ld --time-style=+%s {} + | sort && find hersir dev.hersir.app -type f -exec sha256sum {} + | sort)" = "$before"

  # Whether this pull request (or push to main) changes what the scoop job checks: the Scoop package (packaging/scoop),
  # install.ps1, which builds the programs the package installs, gizai-mcp's Cargo.toml, as hersir-mcp.exe's static C
  # runtime holds only while its crates have no C code, and this workflow. A version bump changes none of them. HEAD is
  # the pull request's merge commit, and HEAD^1 is main; for a push, the commit main was at before. When the fetch or
  # the check fails, the scoop job runs.
  scoop-changes:
    name: Scoop package changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Scoop package changed?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA" && base="HEAD^1" || base=""
          else
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE" || base=""
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- packaging/scoop install.ps1 crates/gizai-mcp/Cargo.toml .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # hersir in the Scoop bucket (packaging/scoop), installed on Windows as its users install it, from a local bucket
  # with a test build of this commit:
  # - install.ps1 -BuildOnly builds Hersir as Release builds does, and dumpbin /dependents lists no VCRUNTIME140.dll
  #   (nor another Visual C++ runtime DLL) for hersir.exe and hersir-mcp.exe: a fresh Windows has none;
  # - the two programs, packed as Release builds packs hersir-X.Y.Z-windows-x86_64.zip, go into a local bucket laid out
  #   as scripts/packages.sh lays out Yotech-AI/scoop-bucket, with the manifest's version, address (the zip, as a
  #   file:// address) and sha256 filled in for that zip;
  # - Scoop installs it in Windows PowerShell 5.1: hersir --version says the version, hersir-package.txt beside the
  #   programs says scoop, the Start menu shortcut carries dev.hersir.app and starts hersir.exe in Scoop's current
  #   folder, and neither program has a Zone.Identifier stream;
  # - an update to a newer version (the same zip), in PowerShell 7, keeps the shortcut and the mark;
  # - scoop uninstall hersir, and scoop uninstall hersir --purge, leave the data folders as they were.
  # It publishes nothing: the bucket gets a release only from scripts/packages.sh, on Jeffrey's computer.
  scoop:
    name: Windows (Scoop)
    needs: scoop-changes
    if: needs.scoop-changes.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # The build keeps the repository's LF, as Release builds' does: Hersir embeds text files as they are.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Before the build: the shortcut script and the manifest's hooks, as Scoop joins their lines, parse in Windows
      # PowerShell 5.1.
      - name: The shortcut script and the manifest's hooks parse
        shell: powershell
        run: |
          $manifest = Get-Content -LiteralPath packaging\scoop\hersir.json -Raw | ConvertFrom-Json
          $sources = [ordered]@{
            'scripts\hersir-shortcut.ps1' = Get-Content -LiteralPath packaging\scoop\scripts\hersir-shortcut.ps1 -Raw
            'post_install' = $manifest.post_install -join "`r`n"
            'pre_uninstall' = $manifest.pre_uninstall -join "`r`n"
          }
          foreach ($name in $sources.Keys) {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseInput($sources[$name], [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs) { "$name doesn't parse:"; $errs; exit 1 }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # The build Release builds makes for a release, with Windows PowerShell 5.1, without caches.
      - name: Build (install.ps1 -BuildOnly)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -BuildOnly
          if ($LASTEXITCODE -ne 0) { 'install.ps1 -BuildOnly failed'; exit 1 }

      # What each program needs to start, from dumpbin of the Visual Studio the build used.
      - name: hersir.exe and hersir-mcp.exe need no VCRUNTIME140.dll
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { "vswhere found no dumpbin.exe"; exit 1 }
          foreach ($exe in @('hersir.exe', 'hersir-mcp.exe')) {
            $deps = @(& $dumpbin /nologo /dependents "target\release\$exe")
            if ($LASTEXITCODE -ne 0) { "dumpbin /dependents $exe failed"; exit 1 }
            $deps | ForEach-Object { Write-Host $_ }
            if (-not ($deps -match '^\s*KERNEL32\.dll\s*$')) { "dumpbin /dependents $exe lists no KERNEL32.dll: it didn't list the dependencies"; exit 1 }
            $runtime = @($deps -match '^\s*(vcruntime|msvcp)\d+\w*\.dll\s*$' | ForEach-Object { $_.Trim() })
            if ($runtime) { "$exe needs $($runtime -join ', '), which a fresh Windows doesn't have."; exit 1 }
          }

      # Scoop for the runner's account, with its own install line: -RunAsAdmin, as the runner's account is an
      # administrator. Its commands go on the PATH of the steps after this one.
      - name: Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod -Uri https://get.scoop.sh)} -RunAsAdmin"
          $shims = Join-Path $env:USERPROFILE 'scoop\shims'
          if (-not (Test-Path -LiteralPath (Join-Path $shims 'scoop.ps1'))) { "Scoop isn't in $shims"; exit 1 }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $shims
          exit 0

      # The zip as Release builds packs it, in the runner's temp folder, and the bucket as scripts/packages.sh lays it
      # out (bucket/hersir.json, scripts/hersir-shortcut.ps1, README.md, LICENSE) in a git repository of its own there.
      - name: A local bucket with the test build
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $archive = "hersir-$version-windows-x86_64.zip"
          $builds = Join-Path $env:RUNNER_TEMP 'builds'
          $bucket = Join-Path $env:RUNNER_TEMP 'scoop-bucket'
          New-Item -ItemType Directory -Force -Path $builds | Out-Null
          $zipPath = Join-Path $builds $archive
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Create')
          try {
            foreach ($p in @('hersir.exe', 'hersir-mcp.exe')) {
              $file = Join-Path $env:GITHUB_WORKSPACE "target\release\$p"
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $file, "target/release/$p", 'Optimal') | Out-Null
            }
          } finally {
            $zip.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive"
          $manifest = Get-Content -LiteralPath packaging\scoop\hersir.json -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = ([Uri]$zipPath).AbsoluteUri
          $manifest.architecture.'64bit'.hash = $hash
          New-Item -ItemType Directory -Force -Path "$bucket\bucket", "$bucket\scripts" | Out-Null
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$bucket\bucket\hersir.json"
          Copy-Item -LiteralPath packaging\scoop\scripts\hersir-shortcut.ps1 -Destination "$bucket\scripts\"
          Copy-Item -LiteralPath packaging\scoop\README.md, packaging\LICENSE -Destination "$bucket\"
          Get-Content -LiteralPath "$bucket\bucket\hersir.json"
          git -C $bucket init -q -b main
          git -C $bucket add -A
          git -C $bucket -c user.name=CI -c user.email=ci@hersir.invalid commit -q -m "hersir $version"
          if ($LASTEXITCODE -ne 0) { 'Could not commit the local bucket'; exit 1 }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`nBUCKET=$bucket`n")

      # As the bucket's README says, in Windows PowerShell 5.1, which runs Scoop and the manifest's post_install.
      - name: scoop install hersir from the local bucket (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $url = ([Uri]$env:BUCKET).AbsoluteUri
          scoop bucket add hersir $url
          scoop install hersir/hersir
          $prefix = Join-Path $env:USERPROFILE 'scoop\apps\hersir\current'
          foreach ($exe in @('hersir.exe', 'hersir-mcp.exe')) {
            if (-not (Test-Path -LiteralPath "$prefix\$exe")) { "Scoop didn't install $exe in $prefix"; exit 1 }
          }
          exit 0

      # The hersir command, through Scoop's shim; the mark beside the programs; the Start menu shortcut, read back as
      # Install reads install.ps1's; no Zone.Identifier stream, which SmartScreen would stop the programs for.
      - name: hersir --version, hersir-package.txt, the shortcut and no Zone.Identifier
        shell: powershell
        run: |
          $prefix = Join-Path $env:USERPROFILE 'scoop\apps\hersir\current'
          "hersir is $((Get-Command hersir).Source)"
          $got = hersir --version
          "hersir --version: $got"
          if ("$got" -ne "hersir $env:VERSION") { "hersir --version says $got, not hersir $env:VERSION."; exit 1 }
          $mark = Get-Content -LiteralPath "$prefix\hersir-package.txt"
          "hersir-package.txt: $mark"
          if ("$mark" -ne 'scoop') { "hersir-package.txt beside the programs says $mark, not scoop."; exit 1 }
          $menu = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\Scoop Apps'
          $id = (New-Object -ComObject Shell.Application).NameSpace($menu).ParseName('Hersir.lnk').ExtendedProperty('System.AppUserModel.ID')
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $menu 'Hersir.lnk')).TargetPath
          "shortcut: $target, app id $id"
          if ($id -ne 'dev.hersir.app') { 'the Start menu shortcut Hersir.lnk should carry dev.hersir.app'; exit 1 }
          if (-not ($target -like '*\apps\hersir\current\hersir.exe' -and (Test-Path -LiteralPath $target))) {
            "the Start menu shortcut Hersir.lnk should start hersir.exe in Scoop's current folder, $prefix"; exit 1
          }
          foreach ($exe in @('hersir.exe', 'hersir-mcp.exe')) {
            if (Get-Item -LiteralPath "$prefix\$exe" -Stream 'Zone.Identifier' -ErrorAction SilentlyContinue) { "$exe has a Zone.Identifier stream."; exit 1 }
          }
          exit 0

      # A newer version in the bucket (the same zip), which scoop update fetches. Scoop runs the old version's
      # pre_uninstall, which removes the shortcut, then the new version's post_install, here in PowerShell 7.
      - name: An update keeps the shortcut and the mark (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $v = $env:VERSION.Split('.')
          $next = "$($v[0]).$($v[1]).$([int]$v[2] + 1)"
          $file = "$env:BUCKET\bucket\hersir.json"
          $manifest = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          $manifest.version = $next
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $file
          git -C $env:BUCKET -c user.name=CI -c user.email=ci@hersir.invalid commit -q -a -m "hersir $next"
          scoop update
          scoop update hersir
          $prefix = Join-Path $env:USERPROFILE 'scoop\apps\hersir\current'
          $now = (Get-Item -LiteralPath $prefix).Target
          "current is $now"
          if ("$now" -notlike "*\hersir\$next") { "scoop update hersir didn't install $next: current is $now"; exit 1 }
          $mark = Get-Content -LiteralPath "$prefix\hersir-package.txt"
          if ("$mark" -ne 'scoop') { "after the update, hersir-package.txt says $mark, not scoop."; exit 1 }
          $menu = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\Scoop Apps'
          $id = (New-Object -ComObject Shell.Application).NameSpace($menu).ParseName('Hersir.lnk').ExtendedProperty('System.AppUserModel.ID')
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $menu 'Hersir.lnk')).TargetPath
          "shortcut: $target, app id $id"
          if ($id -ne 'dev.hersir.app') { 'after the update, the Start menu shortcut Hersir.lnk should carry dev.hersir.app'; exit 1 }
          if (-not ($target -like '*\apps\hersir\current\hersir.exe' -and (Test-Path -LiteralPath $target))) {
            "after the update, the Start menu shortcut Hersir.lnk should start hersir.exe in Scoop's current folder"; exit 1
          }
          exit 0

      # Hersir's data folder and WebView2's, with a file in each first. scoop uninstall hersir removes the programs, the
      # commands and the shortcut, and leaves both as they were; so does scoop uninstall hersir --purge, after an
      # install again.
      - name: scoop uninstall hersir leaves the data folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $data = @((Join-Path $env:APPDATA 'Hersir'), (Join-Path $env:LOCALAPPDATA 'dev.hersir.app'))
          New-Item -ItemType Directory -Force -Path "$($data[0])\backups", $data[1] | Out-Null
          Set-Content -LiteralPath "$($data[0])\gizai.db" -Value 'your data'
          Set-Content -LiteralPath "$($data[0])\backups\gizai-manual.db" -Value 'a backup'
          Set-Content -LiteralPath "$($data[1])\storage" -Value 'storage'
          function Get-DataState {
            foreach ($dir in $data) {
              Get-ChildItem -LiteralPath $dir -Recurse -Force | Sort-Object FullName | ForEach-Object {
                $hash = if ($_.PSIsContainer) { '' } else { (Get-FileHash -LiteralPath $_.FullName).Hash }
                '{0} {1} {2}' -f $_.FullName, $_.LastWriteTimeUtc.Ticks, $hash
              }
            }
          }
          $before = (Get-DataState) -join "`n"
          $before
          $menu = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\Scoop Apps'
          foreach ($purge in @($false, $true)) {
            if ($purge) {
              scoop install hersir/hersir
              scoop uninstall hersir --purge
            } else {
              scoop uninstall hersir
            }
            foreach ($gone in @((Join-Path $env:USERPROFILE 'scoop\apps\hersir'), (Join-Path $env:USERPROFILE 'scoop\shims\hersir.exe'),
                (Join-Path $env:USERPROFILE 'scoop\shims\hersir-mcp.exe'), (Join-Path $menu 'Hersir.lnk'))) {
              if (Test-Path -LiteralPath $gone) { "After scoop uninstall (purge: $purge), $gone is still there."; exit 1 }
            }
            $after = (Get-DataState) -join "`n"
            if ($after -ne $before) { "scoop uninstall (purge: $purge) changed the data folders:"; $after; exit 1 }
          }
          exit 0
