# Installs Hersir's latest release with hersir.dev's own one lines, as someone reading docs/install.md does, into a
# scratch folder, on Ubuntu 24.04, macOS (Apple silicon) and Windows:
#   curl -fsSL https://hersir.dev/install.sh | sh     (on Ubuntu first with --check, then the packages it names)
#   irm https://hersir.dev/install.ps1 | iex          (in Windows PowerShell 5.1)
# It passes when the installed Hersir is the latest release on GitHub, then uninstalls it with the same line. It uses
# nothing from the checkout. The line checks the release's signature with Hersir's own keys and installs its
# ready-made build (GA-252): it sets up no Rust or Node.js, and on macOS and Windows the installed Hersir must have no
# mark of a download from the internet. It runs when scripts/sign-release.sh starts it, once a release's signature is
# uploaded (GA-260), every week, by hand, and on a pull request into main that changes this file; not when a release
# is published, which isn't signed yet then. Not on the release's pull request into production either (GA-283): it
# would install the published release with production's get.sh, nothing of the pull request. It signs, releases and
# uploads nothing.
# A release from 0.17.0 on installs the hersir names (hersir, hersir.exe, hersir-installed.txt); an older one, the
# gizai names, and it reads its prefix from GIZAI_PREFIX only, so the prefix goes under both names (GA-248).
name: One-line install

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/one-line.yml
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: one-line-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-line:
    name: one line on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # Two waits for GitHub's limit to reset, at most an hour each, and the lines themselves.
    timeout-minutes: 180
    steps:
      # What the line must install: the latest release, as GitHub's own CLI names it, with the job's token. In a step
      # of its own, so the token stays out of what the line runs.
      - name: The latest release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo Yotech-AI/hersir --json tagName --jq .tagName)"
          echo "The latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The line asks GitHub's API for the latest release without a login, which allows 60 calls an hour, and the
      # runners share them. So when it stops at "Finding Hersir's latest release" (Could not read the latest release),
      # it is tried again, at most 3 times: when GitHub's rate_limit says no calls are left, 10 seconds after the limit
      # resets (at most an hour later), else a minute later (GA-283). After that the job fails and says why.
      - name: The one line (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HERSIR_PREFIX: ${{ runner.temp }}/hersir
          GIZAI_PREFIX: ${{ runner.temp }}/hersir
          XDG_DATA_HOME: ${{ runner.temp }}/share
          GIZAI_DATA_DIR: ${{ runner.temp }}/share/gizai
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          fail() { echo "$*"; exit 1; }
          # The command a release installs: hersir from 0.17.0 on, gizai before.
          v="${LATEST#v}"; major="${v%%.*}"; minor="${v#*.}"; minor="${minor%%.*}"
          if [ "$major" -gt 0 ] || [ "$minor" -ge 17 ]; then name=hersir; else name=gizai; fi
          line() {
            for try in 1 2 3 4; do
              printf '\n$ %s\n' "$1"
              status=0
              eval "$1" 2>&1 | tee "$RUNNER_TEMP/line.log" || status=$?
              if [ "$status" = 0 ] || ! grep -q "Could not read the latest release" "$RUNNER_TEMP/line.log"; then return "$status"; fi
              if [ "$try" = 4 ]; then
                fail "The one line could not read Hersir's latest release from GitHub's API, also not after trying again 3 times. GitHub allows 60 calls an hour without a login, and the runners share them: run this again later."
              fi
              # What GitHub's rate_limit says of that limit on this runner (asking it doesn't count against it): the
              # calls left and when it resets, in seconds since 1970. Empty when it can't be read.
              rate="$(curl -fs --max-time 30 https://api.github.com/rate_limit | tr -d '[:space:]')" || rate=""
              rate="$(printf '%s\n' "$rate" | sed -n 's/.*"rate":{\([^}]*\)}.*/\1/p')"
              left="$(printf '%s\n' "$rate" | sed -n 's/.*"remaining":\([0-9][0-9]*\).*/\1/p')"
              reset="$(printf '%s\n' "$rate" | sed -n 's/.*"reset":\([0-9][0-9]*\).*/\1/p')"
              if [ "$left" = 0 ] && [ -n "$reset" ]; then
                seconds=$(( reset + 10 - $(date +%s) ))
                if [ "$seconds" -lt 10 ]; then seconds=10; elif [ "$seconds" -gt 3660 ]; then seconds=3660; fi
                echo "GitHub's limit of 60 calls an hour without a login is used up on this runner: trying again in $(( (seconds + 59) / 60 )) minutes, once it resets ($try of 3)."
                sleep "$seconds"
              else
                echo "Could not read the latest release: trying again in a minute ($try of 3)."
                sleep 60
              fi
            done
          }

          # Ubuntu: the check first, then the system packages it names, with its own line (made non-interactive).
          if [ "$RUNNER_OS" = Linux ]; then
            line 'curl -fsSL https://hersir.dev/install.sh | sh -s -- --check' || true
            packages="$(sed -n '/^Install them with:$/{n;s/^ *//;p;q;}' "$RUNNER_TEMP/line.log")"
            if [ -n "$packages" ]; then
              sudo apt-get update
              packages="$(printf '%s\n' "$packages" | sed 's/apt install /apt install -y /g')"
              printf '\n$ %s\n' "$packages"
              eval "$packages" || fail "The packages the check names didn't install."
            fi
          fi

          line 'curl -fsSL https://hersir.dev/install.sh | sh' || fail "The one line didn't install Hersir."

          installed="$("$HERSIR_PREFIX/bin/$name" --version)" || fail "$HERSIR_PREFIX/bin/$name --version failed: $installed"
          echo "The latest release: $LATEST. Installed: $installed."
          [ "$installed" = "$name ${LATEST#v}" ] || fail "The one line installed $installed, not the latest release, $LATEST."
          # macOS: nothing in Hersir.app has a quarantine mark, which Gatekeeper would stop it for.
          if [ "$RUNNER_OS" = macOS ]; then
            app="$HERSIR_PREFIX/lib/hersir/Hersir.app"
            if xattr -r -l "$app" | grep com.apple.quarantine; then fail "$app has a quarantine mark."; fi
          fi

          line 'curl -fsSL https://hersir.dev/install.sh | sh -s -- --uninstall' || fail "The one line didn't uninstall Hersir."
          for path in "$HERSIR_PREFIX/lib/hersir" "$HERSIR_PREFIX/bin/hersir" "$XDG_DATA_HOME/applications/hersir.desktop" \
            "$HERSIR_PREFIX/lib/gizai" "$HERSIR_PREFIX/bin/gizai" "$XDG_DATA_HOME/applications/gizai.desktop"; do
            if [ -e "$path" ] || [ -L "$path" ]; then fail "$path is still there after the uninstall."; fi
          done

      # The line runs in a Windows PowerShell 5.1 of its own each time, as in a new window. Piped into iex, get.ps1
      # returns rather than exit, with its result in $LASTEXITCODE.
      - name: The one line (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HERSIR_PREFIX: ${{ runner.temp }}\hersir
          GIZAI_PREFIX: ${{ runner.temp }}\hersir
          GIZAI_DATA_DIR: ${{ runner.temp }}\hersir-data
          LOCALAPPDATA: ${{ runner.temp }}\localappdata
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          # The names a release installs: hersir from 0.17.0 on, gizai before.
          $name = if ([version]($env:LATEST -replace '^v', '') -ge [version]'0.17.0') { 'hersir' } else { 'gizai' }
          function Invoke-Line([string]$Line) {
            $wrapper = "$env:RUNNER_TEMP\line.ps1"
            Set-Content -LiteralPath $wrapper -Value ($Line + '; "returned $LASTEXITCODE"')
            for ($try = 1; $true; $try++) {
              Write-Host ''
              Write-Host "> $Line"
              $out = @(powershell -NoProfile -ExecutionPolicy Bypass -File $wrapper | ForEach-Object { Write-Host $_; $_ })
              $returned = if ($out.Count) { $out[-1] } else { 'returned nothing' }
              if ($returned -eq 'returned 0') { return }
              if (-not ($out -match 'Could not read the latest release')) { Write-Host "The one line failed: it $returned."; exit 1 }
              if ($try -eq 4) {
                Write-Host "The one line could not read Hersir's latest release from GitHub's API, also not after trying again 3 times. GitHub allows 60 calls an hour without a login, and the runners share them: run this again later."
                exit 1
              }
              # What GitHub's rate_limit says of that limit on this runner (asking it doesn't count against it): the
              # calls left and when it resets, in seconds since 1970. Nothing when it can't be read. GitHub takes
              # TLS 1.2 or newer, added as get.ps1 adds it, here for this step's own PowerShell only.
              $rate = $null
              try {
                $tls = [Net.ServicePointManager]::SecurityProtocol
                if ([int]$tls -ne 0 -and ([int]$tls -band [int][Net.SecurityProtocolType]::Tls12) -eq 0) {
                  [Net.ServicePointManager]::SecurityProtocol = $tls -bor [Net.SecurityProtocolType]::Tls12
                }
                $rate = (Invoke-RestMethod -Uri https://api.github.com/rate_limit -UseBasicParsing -TimeoutSec 30).rate
              } catch { }
              if ($rate -and "$($rate.remaining)" -eq '0' -and "$($rate.reset)" -match '^\d+$') {
                $seconds = [long]$rate.reset + 10 - [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
                if ($seconds -lt 10) { $seconds = 10 } elseif ($seconds -gt 3660) { $seconds = 3660 }
                Write-Host "GitHub's limit of 60 calls an hour without a login is used up on this runner: trying again in $([Math]::Ceiling($seconds / 60.0)) minutes, once it resets ($try of 3)."
                Start-Sleep -Seconds $seconds
              } else {
                Write-Host "Could not read the latest release: trying again in a minute ($try of 3)."
                Start-Sleep -Seconds 60
              }
            }
          }

          Invoke-Line 'irm https://hersir.dev/install.ps1 | iex'

          $marker = "$env:HERSIR_PREFIX\$name-installed.txt"
          if (-not (Test-Path -LiteralPath $marker)) { "The one line installed nothing: $marker is missing."; exit 1 }
          $installed = Get-Content -LiteralPath $marker
          "The latest release: $env:LATEST. Installed: $installed."
          if ("$installed" -ne "$name $($env:LATEST -replace '^v', '')") { "The one line installed $installed, not the latest release, $env:LATEST."; exit 1 }
          # No Zone.Identifier stream on the programs, which SmartScreen would stop them for.
          foreach ($exe in @("$name.exe", "$name-mcp.exe")) {
            if (Get-Item -LiteralPath "$env:HERSIR_PREFIX\$exe" -Stream 'Zone.Identifier' -ErrorAction SilentlyContinue) { "$exe has a Zone.Identifier stream."; exit 1 }
          }

          Invoke-Line '& ([scriptblock]::Create((irm https://hersir.dev/install.ps1))) -Uninstall'
          foreach ($file in @('hersir.exe', 'hersir-mcp.exe', 'hersir-installed.txt', 'gizai.exe', 'gizai-mcp.exe', 'gizai-installed.txt')) {
            if (Test-Path -LiteralPath "$env:HERSIR_PREFIX\$file") { "$file is still there after the uninstall."; exit 1 }
          }
